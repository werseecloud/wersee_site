<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23fff'/%3E%3Cpath d='M15 18h8l5 25h8l5-25h8L41 50H23z' fill='%23050505'/%3E%3C/svg%3E">
    <title>Site not published - Wersee</title>
    <style>
      :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#070707;color:#fff}
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 0,rgba(99,102,241,.22),transparent 42%),#070707;overflow-x:hidden}
      .shell{width:min(920px,100%);display:grid;gap:22px}
      main{width:min(560px,100%);padding:42px;border:1px solid rgba(255,255,255,.1);border-radius:30px;background:rgba(255,255,255,.035);box-shadow:0 32px 100px rgba(0,0,0,.4);text-align:center}
      main{justify-self:center}
      .mark{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:16px;background:#fff;color:#050505;font-weight:900;font-size:22px}
      .eyebrow{margin:22px 0 0;color:#a5b4fc;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
      h1{margin:12px 0 0;font-size:clamp(30px,7vw,48px);line-height:1.05;letter-spacing:-.04em}p{margin:18px auto 0;max-width:420px;color:rgba(255,255,255,.48);line-height:1.7}
      a{display:inline-block;margin-top:28px;padding:12px 18px;border-radius:13px;background:#fff;color:#050505;text-decoration:none;font-size:14px;font-weight:800}
      .address{display:block;width:max-content;max-width:100%;margin:18px auto 0;padding:8px 12px;overflow:hidden;text-overflow:ellipsis;border:1px solid rgba(255,255,255,.08);border-radius:999px;background:rgba(255,255,255,.035);color:rgba(255,255,255,.42);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;white-space:nowrap}
      .status{display:flex;width:max-content;margin:18px auto 0;align-items:center;gap:7px;color:rgba(255,255,255,.42);font-size:11px;font-weight:700}.status-dot{width:7px;height:7px;border-radius:999px;background:#34d399;box-shadow:0 0 16px rgba(52,211,153,.7)}
      .published{display:none;min-width:0;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
      .published[data-ready="true"]{display:block}
      .published-title{margin:0 0 10px;text-align:center;color:rgba(255,255,255,.32);font-size:11px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}
      .rail{display:flex;width:max-content;gap:10px;animation:wersee-marquee 34s linear infinite;will-change:transform}
      .published:hover .rail,.published:focus-within .rail{animation-play-state:paused}
      .site-card{display:flex;align-items:center;gap:10px;width:238px;min-height:68px;margin:0;padding:11px 13px;border:1px solid rgba(255,255,255,.085);border-radius:18px;background:rgba(255,255,255,.035);color:#fff;text-align:left;box-shadow:inset 0 1px rgba(255,255,255,.035)}
      .site-card:hover{background:rgba(255,255,255,.075);border-color:rgba(255,255,255,.14)}
      .site-icon{display:grid;place-items:center;flex:0 0 40px;height:40px;border-radius:12px;background:rgba(255,255,255,.08);overflow:hidden;color:rgba(255,255,255,.75);font-size:14px;font-weight:850}
      .site-icon img{width:100%;height:100%;object-fit:cover}.site-copy{min-width:0}.site-name,.site-url{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .site-name{font-size:13px;font-weight:720}.site-url{margin-top:4px;color:rgba(255,255,255,.35);font-size:11px}.market{color:#a5b4fc}
      @keyframes wersee-marquee{to{transform:translateX(calc(-50% - 5px))}}
      @media(max-width:620px){body{padding:16px}.shell{gap:16px}main{padding:34px 24px;border-radius:26px}.site-card{width:210px}}
      @media(prefers-reduced-motion:reduce){.rail{animation:none}.published{overflow-x:auto;scrollbar-width:none}.published::-webkit-scrollbar{display:none}}
    </style>
  </head>
  <body>
    <div class="shell">
      <main data-wersee-sites-fallback="2026-07-26">
        <div class="mark">W</div>
        <p class="eyebrow">Wersee Sites</p>
        <h1>This site is not published yet.</h1>
        <p>The address is connected securely, but its owner has not published an active release.</p>
        <span class="address" id="requested-domain"></span>
        <span class="status"><span class="status-dot"></span>Secure Wersee connection</span>
        <a href="https://wersee.com">Go to Wersee</a>
      </main>
      <section class="published" id="published-sites" aria-label="Sites published with Wersee">
        <p class="published-title">Verified domains managed by Wersee</p>
        <div class="rail" id="published-sites-rail"></div>
      </section>
    </div>
    <script>
      (() => {
        const section = document.getElementById('published-sites');
        const rail = document.getElementById('published-sites-rail');
        document.getElementById('requested-domain').textContent = window.location.hostname;
        const isManagedWerseeUrl = (url) => (
          url.protocol === 'https:'
          && url.port === ''
          && url.username === ''
          && url.password === ''
          && url.pathname === '/'
          && url.search === ''
          && url.hash === ''
          && /^[a-z0-9](?:[a-z0-9-]{1,61}[a-z0-9])?\.wersee\.com$/.test(url.hostname)
        );
        const appendCard = (site, duplicate) => {
          let url;
          try { url = new URL(site.url); } catch { return; }
          if (!isManagedWerseeUrl(url) || url.hostname === window.location.hostname) return;
          const card = document.createElement('a');
          card.className = 'site-card';
          card.href = url.href;
          card.target = '_blank';
          card.rel = 'noopener noreferrer';
          if (duplicate) card.setAttribute('aria-hidden', 'true');
          const icon = document.createElement('span');
          icon.className = 'site-icon';
          icon.textContent = String(site.name || 'W').trim().charAt(0).toUpperCase() || 'W';
          const copy = document.createElement('span');
          copy.className = 'site-copy';
          const name = document.createElement('span');
          name.className = 'site-name';
          name.textContent = String(site.name || url.hostname).slice(0, 80);
          const host = document.createElement('span');
          host.className = `site-url${site.marketplace ? ' market' : ''}`;
          host.textContent = `${site.marketplace ? 'Marketplace \u00b7 ' : ''}${url.hostname}`;
          copy.append(name, host);
          card.append(icon, copy);
          rail.appendChild(card);
        };
        fetch('https://www.wersee.com/api/sites/public-directory', { headers: { accept: 'application/json' } })
          .then((response) => response.ok ? response.json() : Promise.reject())
          .then(({ sites }) => {
            const safeSites = Array.isArray(sites) ? sites.slice(0, 30) : [];
            if (!safeSites.length) return;
            safeSites.forEach((site) => appendCard(site, false));
            safeSites.forEach((site) => appendCard(site, true));
            section.dataset.ready = 'true';
          })
          .catch(() => {});
      })();
    </script>
  </body>
</html>
