<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wersee</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 360px;
      height: 360px;
      overflow: hidden;
      background: transparent;
      -webkit-app-region: drag;
      user-select: none;
    }

    .stage {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    /* Soft ambient glow behind logo */
    .halo {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center,
          rgba(99,102,241,0.35) 0%,
          rgba(99,102,241,0.15) 30%,
          rgba(99,102,241,0)   65%);
      filter: blur(30px);
      animation: halo 3.2s ease-in-out infinite;
      pointer-events: none;
    }

    .halo-2 {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center,
          rgba(168,85,247,0.25) 0%,
          rgba(168,85,247,0)    70%);
      filter: blur(20px);
      animation: halo 4s ease-in-out infinite reverse;
      pointer-events: none;
    }

    /* Rotating ring */
    .ring {
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-top-color: rgba(129,140,248,0.9);
      border-right-color: rgba(129,140,248,0.3);
      animation: spin 1.6s linear infinite;
      box-shadow: 0 0 24px rgba(99,102,241,0.25);
    }

    .logo {
      position: relative;
      width: 120px;
      height: 120px;
      object-fit: contain;
      animation:
        logoIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards,
        logoFloat 3s ease-in-out 0.7s infinite;
      opacity: 0;
      transform: scale(0.85);
      filter: drop-shadow(0 10px 30px rgba(99,102,241,0.45));
    }

    @keyframes logoIn {
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes logoFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-6px) scale(1.02); }
    }
    @keyframes halo {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.08); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="halo"></div>
    <div class="halo-2"></div>
    <div class="ring"></div>
    <img class="logo" src="./assets/logo.png" alt="" />
  </div>
</body>
</html>
